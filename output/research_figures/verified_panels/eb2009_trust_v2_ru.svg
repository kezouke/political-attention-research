  <g id="text_14">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616b" x="43.2" y="58.464" transform="rotate(-0 43.2 58.464)">Eurobarometer 71.3 · Европейские выборы 2009 года · 19 стран · 15 962 участника</text>
  </g>
  <g id="text_15">
   <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616b" x="43.2" y="418.32" transform="rotate(-0 43.2 418.32)">Недоверие вместо доверия; экономика, приоритет, второй вид доверия, страна и социальные признаки учтены.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616b" x="43.2" y="439.992" transform="rotate(-0 43.2 439.992)">Линии: 95%-ные интервалы, 1 000 повторных выборок стран. Страны имеют одинаковый суммарный вес.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616b" x="43.2" y="461.664" transform="rotate(-0 43.2 461.664)">Ответы получены после выборов. Это условные связи. PopuList 4.0 включает пограничные случаи.</text>
  </g>
  <g id="text_18">

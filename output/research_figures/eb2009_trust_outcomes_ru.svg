  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616b" x="42.768" y="390.096" transform="rotate(-0 42.768 390.096)">Сравнение недоверия с доверием при учёте экономики, приоритетов, второго вида доверия,</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616b" x="42.768" y="405.972" transform="rotate(-0 42.768 405.972)">страны и социально-демографических характеристик. Линии: 95% интервалы, повторная выборка стран.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616b" x="42.768" y="426.384" transform="rotate(-0 42.768 426.384)">Установки измерены после выборов. Это условные связи, не причинные эффекты. Источник: Eurobarometer 71.3.</text>
  </g>
  <g id="text_18">
